<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5FA">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="피클팀 공용 작업방 — 손성훈(대장)과 벨벳·엄마·3번이 이슈로 일을 나누는 채팅형 작업판">
<title>🌈 대장 · 피클팀 공용 작업방</title>
<style>
  :root{
    --bg:#F6F5FA;
    --surface:#FFFFFF;
    --surface2:#FBFAFF;
    --line:#EFEDF7;
    --line2:#E2DFEE;
    --text:#1C1B22;
    --text2:#3A3746;
    --muted:#8A8798;
    --muted2:#A9A6B8;
    --violet:#6C4DFF;
    --violet-deep:#5B3BE8;
    --violet-soft:#EDE8FF;
    --violet-ink:#3F2A99;
    --violet-line:#DCD3FF;
    --green:#12A05C;
    --amber:#C98A18;
    --todo:#9A6707;  --todo-bg:#FCF3D8;
    --doing:#1A5FC4; --doing-bg:#E6F0FF;
    --done:#0B7A3F;  --done-bg:#E4F6EC;
    --shadow:0 1px 2px rgba(28,27,34,.05), 0 6px 18px rgba(60,45,140,.05);
    --r:18px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(720px 420px at 50% -14%, rgba(108,77,255,.10), transparent 66%),
      radial-gradient(520px 380px at 100% 104%, rgba(255,186,120,.10), transparent 62%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.5;
    min-height:100vh;min-height:100dvh;
    overflow-x:hidden;
    overflow-wrap:anywhere;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(108,77,255,.18)}

  /* ================= app frame ================= */
  .app{
    width:100%;max-width:560px;margin:0 auto;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    background:var(--bg);
    position:relative;overflow:hidden;
  }
  @media (min-width:641px){
    body{display:grid;place-items:center;padding:22px 16px;overflow:hidden}
    .app{
      height:min(940px, calc(100dvh - 44px));
      max-width:500px;
      border-radius:30px;
      box-shadow:0 30px 80px rgba(44,30,100,.18), 0 1px 0 rgba(255,255,255,.9) inset;
      border:1px solid rgba(255,255,255,.85);
    }
  }

  /* ================= header ================= */
  header.hd{
    flex:0 0 auto;position:relative;z-index:20;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .hd-in{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;min-height:56px}
  .logo{
    width:36px;height:36px;flex:0 0 auto;border-radius:12px;
    display:grid;place-items:center;font-size:19px;line-height:1;
    background:linear-gradient(150deg,#FFFFFF,#F3EFFF);
    border:1px solid #ECE5FF;
    box-shadow:0 3px 10px rgba(108,77,255,.10);
  }
  .hd-txt{min-width:0;flex:1}
  .hd-txt h1{
    margin:0;font-size:17px;font-weight:800;letter-spacing:-.03em;
    display:flex;align-items:center;gap:6px;line-height:1.25;
  }
  .hd-txt h1 .tag{
    font-size:10px;font-weight:800;letter-spacing:-.01em;
    background:var(--violet-soft);color:var(--violet-ink);
    border-radius:999px;padding:2px 7px;
  }
  .hd-txt p{
    margin:1px 0 0;font-size:10.8px;color:var(--muted);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hd-act{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .icbtn{
    width:33px;height:33px;border-radius:50%;border:0;
    background:#F5F3FB;display:grid;place-items:center;font-size:14px;
    transition:transform .12s, background .12s;
  }
  .icbtn:active{transform:scale(.92);background:#EDE8FF}
  .icbtn.on{background:var(--violet-soft)}
  .icbtn.spin span{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ================= character stage ================= */
  .stage{
    flex:0 0 auto;position:relative;z-index:10;
    display:grid;grid-template-columns:repeat(4,1fr);align-items:end;
    gap:2px;padding:8px 10px 2px;
    background:linear-gradient(180deg,#FFFFFF 0%,#FCFBFF 46%,var(--bg) 100%);
  }
  .critter{
    appearance:none;-webkit-appearance:none;border:0;background:transparent;
    padding:4px 2px 2px;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    min-width:0;
  }
  .critter:active{transform:scale(.975)}
  .critter.on::before{
    content:"";position:absolute;left:50%;top:3px;
    width:56px;height:56px;margin-left:-28px;
    border-radius:20px;background:rgba(108,77,255,.08);
  }
  .cr-wrap{position:relative;display:block;line-height:0;animation:bob 3.8s ease-in-out infinite;transition:transform .12s}
  .critter:nth-child(2) .cr-wrap{animation-delay:.45s}
  .critter:nth-child(3) .cr-wrap{animation-delay:.9s}
  .critter:nth-child(4) .cr-wrap{animation-delay:1.35s}
  @keyframes bob{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-2.5px) scale(1.018)}
  }
  .critter .pav{width:54px;height:54px;display:block;filter:drop-shadow(0 3px 2px rgba(42,33,64,.14))}
  @media (min-width:641px){ .critter .pav{width:62px;height:62px} }
  .cr-name{
    font-size:11px;font-weight:800;letter-spacing:-.02em;color:#2C2A36;
    line-height:1.25;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  .cr-st{
    display:flex;align-items:center;gap:3px;
    font-size:9.3px;font-weight:700;color:var(--muted);line-height:1.2;
    white-space:nowrap;
  }
  .cr-st i{width:4.5px;height:4.5px;border-radius:50%;background:var(--green);flex:0 0 auto}
  .cr-st.wait i{background:#E0A33A}
  /* 피클별 일감 수 + 한도 여유 배지 */
  .cr-load{
    display:flex;align-items:center;gap:3px;justify-content:center;
    font-size:9.3px;font-weight:750;color:#6B6779;line-height:1.25;
    white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  .cr-load i{width:4.5px;height:4.5px;border-radius:50%;background:var(--green);flex:0 0 auto}
  .cr-load.wait i{background:#E0A33A}
  .cr-q{
    display:inline-flex;align-items:center;justify-content:center;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:9.2px;font-weight:800;letter-spacing:-.02em;line-height:1.5;
    border-radius:999px;padding:0 6px;border:1px solid transparent;
    margin-top:1px;
  }
  .cr-q.q-free{background:#E4F6EC;border-color:#C6EAD7;color:#0B7A3F}
  .cr-q.q-normal{background:#FDF0DC;border-color:#F0DFAF;color:#8A5B09}
  .cr-q.q-low{background:#FBE7E7;border-color:#F3C9C9;color:#A82F2F}
  .critter.auto .cr-q{box-shadow:0 0 0 2px rgba(108,77,255,.30)}
  .critter.auto .cr-name{color:var(--violet-deep)}

  /* blink & life */
  .pav .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.6s infinite}
  .critter:nth-child(2) .pav .eyes{animation-duration:6.4s;animation-delay:.8s}
  .critter:nth-child(3) .pav .eyes{animation-duration:6.9s;animation-delay:2.1s}
  .critter:nth-child(4) .pav .eyes{animation-duration:6.2s;animation-delay:3.4s}
  @keyframes blink{
    0%,91%,100%{transform:scaleY(1)}
    93.5%,95%{transform:scaleY(.08)}
  }
  @media (prefers-reduced-motion:reduce){
    .cr-wrap{animation:none}
    .pav .eyes{animation:none}
    .icbtn.spin span{animation:none}
    .sheet,.veil,.toast{animation:none !important}
    *{scroll-behavior:auto !important}
  }

  /* ================= live bar ================= */
  .livebar{
    flex:0 0 auto;display:flex;align-items:center;gap:5px;
    padding:0 16px 6px;font-size:10.3px;color:var(--muted);
    min-height:19px;
  }
  .livebar .pip{width:5.5px;height:5.5px;border-radius:50%;background:var(--muted2);flex:0 0 auto}
  .livebar.live .pip{background:var(--green);box-shadow:0 0 0 3px rgba(18,160,92,.14);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .livebar .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .livebar .txt b{font-weight:800;color:#4A4658}
  .livebar .sep{color:var(--line2)}
  .livebar button{
    margin-left:auto;flex:0 0 auto;border:0;background:transparent;color:var(--violet);
    font-size:10.3px;font-weight:800;padding:1px 3px;border-radius:6px;
  }
  .livebar button:active{background:var(--violet-soft)}

  /* ================= timeline ================= */
  .tl{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:10px 13px 14px;
    display:flex;flex-direction:column;gap:12px;
    scroll-behavior:smooth;
  }
  .tl::-webkit-scrollbar{width:6px}
  .tl::-webkit-scrollbar-thumb{background:#DCD8EA;border-radius:9px}
  .tl::-webkit-scrollbar-track{background:transparent}

  .day{
    align-self:center;margin:4px 0 0;
    background:#EDEAF6;color:#7C7890;
    font-size:10px;font-weight:800;letter-spacing:-.01em;
    padding:4px 12px;border-radius:999px;
  }

  .msg{display:flex;gap:7px;max-width:100%;align-items:flex-start}
  .msg .av{flex:0 0 auto;line-height:0;margin-top:0}
  .msg .av .pav{width:27px;height:27px;display:block}
  .bd{min-width:0;max-width:calc(100% - 34px);display:flex;flex-direction:column;gap:3px}
  .who{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    font-size:10.5px;color:var(--muted);line-height:1.25;padding-left:2px;
  }
  .who b{font-size:11.5px;font-weight:800;color:#33303F;letter-spacing:-.02em}
  .who .t{font-size:9.8px;color:var(--muted2);font-weight:600}
  .who .h{font-size:9.5px;color:var(--muted2);font-weight:700}

  .bubble{
    background:var(--surface);
    border-radius:18px 18px 18px 4px;
    padding:10px 13px 11px;
    box-shadow:var(--shadow);
    font-size:13.6px;line-height:1.56;color:#25232E;
    max-width:min(100%, 58ch);
  }
  .bubble p{margin:0}
  .bubble p + p{margin-top:5px}
  .bubble .em{color:var(--violet-deep);font-weight:800}
  .bubble b{font-weight:800}

  /* right: 성훈님(대표) 지시 */
  .msg.me{justify-content:flex-end;padding-right:1px}
  .msg.me .bd{align-items:flex-end;max-width:calc(100% - 6px)}
  .msg.me .who{justify-content:flex-end;padding:0 3px 0 0}
  .msg.me .bubble{
    background:var(--violet-soft);
    border-radius:18px 18px 4px 18px;
    color:#33236B;
    box-shadow:0 2px 10px rgba(108,77,255,.10);
  }
  .msg.me .bubble .em{color:#4B2FC9}

  /* ================= pickle card (inside bubble) ================= */
  .bubble.is-card{padding:12px 13px 12px}
  .pcard-h{display:flex;gap:8px;align-items:flex-start}
  .pcard-emoji{
    flex:0 0 auto;width:27px;height:27px;border-radius:9px;
    display:grid;place-items:center;font-size:14px;line-height:1;
    background:var(--violet-soft);
  }
  .pcard-tx{min-width:0;padding-top:1px}
  .pcard-t{display:block;font-size:13.4px;font-weight:800;letter-spacing:-.02em;color:#201E2A;line-height:1.35}
  .pcard-s{display:block;font-size:10.6px;color:var(--muted);margin-top:2px;line-height:1.35}
  .pcard-rows{
    margin:9px 0 0;padding:8px 0 0;border-top:1px solid var(--line);
    display:grid;grid-template-columns:auto 1fr;gap:5px 10px;
    font-size:11.4px;line-height:1.4;
  }
  .pcard-rows dt{color:var(--muted);font-weight:700;white-space:nowrap}
  .pcard-rows dd{margin:0;color:#332F40;font-weight:750;min-width:0}
  .pcard-link{
    display:flex;align-items:center;justify-content:center;gap:5px;
    margin-top:10px;padding:8px 10px;border-radius:11px;
    background:#F4F1FF;color:var(--violet-deep);
    font-size:11.6px;font-weight:800;letter-spacing:-.01em;
    transition:background .12s;
  }
  .pcard-link:active{background:#E9E3FF}

  /* reaction chips */
  .reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;padding-left:2px}
  .msg.me .reacts{justify-content:flex-end;padding:0 2px 0 0}
  .react{
    display:inline-flex;align-items:center;gap:3px;
    border:1px solid var(--line);background:var(--surface);
    border-radius:999px;padding:2px 8px 2px 7px;
    font-size:10.6px;font-weight:800;color:#6C6880;line-height:1.4;
    transition:transform .12s, background .12s, border-color .12s;
  }
  .react b{font-size:10px;color:#8C879E;font-weight:800}
  .react:active{transform:scale(.94)}
  .react.on{background:var(--violet-soft);border-color:var(--violet-line);color:var(--violet-ink)}
  .react.on b{color:var(--violet-deep)}

  /* chips inside bubbles */
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
  .chip{
    display:inline-flex;align-items:center;gap:4px;max-width:100%;
    font-size:10.2px;font-weight:750;line-height:1.35;
    border-radius:999px;padding:3px 8px;
    border:1px solid var(--line);background:#F7F6FC;color:#5B576B;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  a.chip:active{background:#EFECFA}
  .chip-issue{background:#F2EEFF;border-color:var(--violet-line);color:var(--violet-ink)}
  .chip-commit{
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    letter-spacing:-.02em;background:#F6F5FB;border-color:#E9E6F2;color:#5A5570;
  }
  .chip.st-todo{background:var(--todo-bg);border-color:#F0DFAF;color:var(--todo)}
  .chip.st-doing{background:var(--doing-bg);border-color:#CBDEFB;color:var(--doing)}
  .chip.st-done{background:var(--done-bg);border-color:#C6EAD7;color:var(--done)}
  .chip-label{background:#F6F3FF;border-color:#E6DEFF;color:#5B34C9}
  .chip-who{background:#F4F2FB;border-color:#E6E2F2;color:#5A5570;font-weight:800}

  /* ✋ 손들기 · ✅ 완료 · ▶ 착수 표시 */
  .mk{
    display:inline-flex;align-items:center;gap:4px;max-width:100%;
    font-size:10px;font-weight:800;letter-spacing:-.01em;line-height:1.4;
    border-radius:999px;padding:2px 8px;margin-bottom:7px;
    border:1px solid transparent;white-space:nowrap;
  }
  .mk-raise{background:#FFF4DC;border-color:#F2DFB0;color:#8A5B09}
  .mk-doing{background:#EAF2FE;border-color:#CBDEFB;color:#1B4E9B}
  .mk-done{background:#E4F6EC;border-color:#C6EAD7;color:#0B7A3F}
  .bubble.mk-raise{box-shadow:inset 0 0 0 1px #F2DFB0, 0 1px 3px rgba(42,33,64,.06)}
  .bubble.mk-doing{box-shadow:inset 0 0 0 1px #CBDEFB, 0 1px 3px rgba(42,33,64,.06)}
  .bubble.mk-done{box-shadow:inset 0 0 0 1px #C6EAD7, 0 1px 3px rgba(42,33,64,.06)}

  /* 🧹 비우기 배지 */
  .clearedbar{
    align-self:stretch;display:flex;align-items:center;gap:6px;cursor:pointer;
    background:#F6F3FF;border:1px dashed #D9CFFF;border-radius:13px;
    padding:7px 8px 7px 11px;font-size:10.6px;font-weight:750;color:#5B34C9;
    line-height:1.4;
  }
  .clearedbar .undo{
    margin-left:auto;flex:0 0 auto;border:0;background:#fff;color:var(--violet-deep);
    font-size:10.4px;font-weight:800;border-radius:9px;padding:5px 9px;
    box-shadow:0 1px 4px rgba(108,77,255,.16);
  }
  .clearedbar .undo:active{background:var(--violet-soft)}

  /* system / hint cards */
  .sys{
    align-self:stretch;width:100%;
    background:var(--surface);
    border:1px solid var(--violet-line);border-radius:16px;
    padding:11px 12px;display:flex;gap:9px;align-items:flex-start;
    font-size:11.6px;color:#57536A;line-height:1.55;
    box-shadow:var(--shadow);
  }
  .sys .ico{
    flex:0 0 auto;width:26px;height:26px;border-radius:9px;
    display:grid;place-items:center;font-size:13px;
    background:var(--violet-soft);
  }
  .sys b{color:#2A2733;font-weight:800}
  .sys .btn-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .sys button.mini{
    border:0;background:#F4F1FF;color:var(--violet-deep);
    font-size:10.8px;font-weight:800;border-radius:9px;padding:6px 9px;
  }
  .sys button.mini:active{background:#E9E3FF}
  .sys.live{background:linear-gradient(135deg,#F7FFFB,#FFFFFF);border-color:#CBEBDC;color:#26624A}
  .sys.live .ico{background:#E4F6EC}
  .sys.live b{color:#14472F}
  .sys.live button.mini{background:#E7F7EE;color:#1B6B45}

  .empty{
    margin:auto;text-align:center;color:var(--muted2);font-size:12px;
    padding:26px 12px;line-height:1.75;
  }
  .empty .big{font-size:26px;display:block;margin-bottom:6px;opacity:.8}

  /* ================= filter bar ================= */
  .filterbar{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    margin:0 12px 4px;padding:6px 7px 6px 11px;
    background:var(--surface);border:1px solid var(--violet-line);border-radius:13px;
    font-size:11px;font-weight:800;color:var(--violet-ink);
    box-shadow:0 2px 8px rgba(108,77,255,.06);
  }
  .filterbar .x{
    margin-left:auto;border:0;background:var(--violet-soft);color:var(--violet-ink);
    border-radius:50%;width:20px;height:20px;font-size:10px;font-weight:800;
  }

  /* ================= composer ================= */
  footer.cmp{
    flex:0 0 auto;position:relative;z-index:15;
    background:linear-gradient(180deg,rgba(246,245,250,.7),var(--bg) 40%);
    padding:6px 12px calc(7px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:4px;
  }
  .pill{
    display:flex;align-items:flex-end;gap:6px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:24px;padding:5px 5px 5px 7px;
    box-shadow:0 2px 4px rgba(28,27,34,.04), 0 8px 24px rgba(60,45,140,.07);
    transition:border-color .15s, box-shadow .15s;
  }
  .pill:focus-within{border-color:var(--violet-line);box-shadow:0 0 0 3px rgba(108,77,255,.08), 0 8px 24px rgba(60,45,140,.08)}
  .selchip{position:relative;flex:0 0 auto;line-height:0}
  .selchip select{
    appearance:none;-webkit-appearance:none;
    border:0;border-radius:999px;background:#F4F1FF;color:var(--violet-deep);
    padding:7px 9px;font-size:11px;font-weight:800;letter-spacing:-.01em;
    max-width:86px;text-overflow:ellipsis;outline:none;
  }
  .selchip.prj select{background:#F6F5FB;color:#5B576B;font-weight:700;max-width:78px}
  .selchip select:focus-visible{box-shadow:0 0 0 2px rgba(108,77,255,.28)}
  #msg{
    flex:1 1 auto;min-width:0;border:0;background:transparent;outline:none;
    resize:none;font-size:13.6px;line-height:1.45;
    max-height:96px;padding:8px 1px 7px;overflow-y:auto;
  }
  #msg::placeholder{color:#A8A4B6}
  .send{
    flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:0;
    background:var(--violet);color:#fff;font-size:16px;font-weight:800;
    display:grid;place-items:center;line-height:1;
    box-shadow:0 4px 12px rgba(108,77,255,.34);
    transition:transform .12s, filter .12s;
  }
  .send:active{transform:scale(.92)}
  .send[disabled]{filter:grayscale(.4) opacity(.55);box-shadow:none}
  .send .spinner{display:inline-block;animation:spin .9s linear infinite;font-size:14px}

  .cmp-hint{
    font-size:9.8px;color:var(--muted2);padding:0 6px;
    display:flex;align-items:center;gap:4px;min-height:12px;

<div class="app" id="app">

<script>
(function(){
  'use strict';

  /* =========================================================
     기본 정보
     ========================================================= */
  var REPO   = 'acesond/pickle-team-workspace';
  var OWNER  = 'acesond';
  var API    = 'https://api.github.com';
  var REPO_URL = 'https://github.com/' + REPO;
  var TOKEN_KEY = 'pickle_team_gh_token';
  var TS_KEY    = 'pickle_team_last_sync';
  var PREF_KEY  = 'pickle_team_prefs';
  var CLEAR_KEY = 'pickle_team_cleared_at';

  var PEOPLE = {
    sonseonghun1: {
      key:'sonseonghun1', name:'대장', alias:'손디', handle:'@sonseonghun1',
      role:'총괄 대장 · 일감 분배·취합·검수',
      status:'총괄 중', short:'총괄', ok:true, rainbow:true,
      color:'#7A4DFF', light:'#B49BFF', initial:'ㅅ'
    },
    sond3: {
      key:'sond3', name:'3번', alias:'', handle:'@sond3',
      role:'팀원 · 초기 세팅 담당',
      status:'이슈 대기', short:'합류', ok:true,
      color:'#0E9C8C', light:'#5EE3CE', initial:'3'
    },
    belbes8: {
      key:'belbes8', name:'벨벳', alias:'', handle:'@belbes8',
      role:'팀원 · 일감 처리',
      status:'이슈 대기', short:'합류', ok:true,
      color:'#C22A57', light:'#FF8FB0', initial:'ㅂ'
    },
    eomma70: {
      key:'eomma70', name:'엄마', alias:'', handle:'@eomma70',
      role:'팀원 · 일감 처리',
      status:'이슈 대기', short:'합류', ok:true,
      color:'#D9592B', light:'#FFA96F', initial:'ㅇ'
    }
  };
  var ORDER = ['sonseonghun1','belbes8','eomma70','sond3'];

  var TARGET_LABEL = {
    all:'전체', auto:'자동(여유)', sonseonghun1:'[손디]', belbes8:'[벨벳]', eomma70:'[엄마]', sond3:'[3번]'
  };
  var PROJECT_LABEL = {
    general:'일반', 'daegu-blog':'daegu-blog', 'hotdeal-threads':'hotdeal-threads'
  };
  var STATUS_TXT = { todo:'todo', doing:'doing', done:'done' };

  /* =========================================================
     한도 여유 · 자동 배정 기준
     ========================================================= */
  var QUOTA_KEY   = 'pickle_team_quota';
  var QUOTA_HOUR  = 4;              // 매일 04:00 KST 자동 리셋
  var AUTO_POOL   = ['belbes8','eomma70','sond3'];   // 자동 배정 대상(실무 팀원 3명)
  var QUOTA_STATES = {
    free:  {key:'free',   label:'여유', tone:'green'},
    normal:{key:'normal', label:'보통', tone:'amber'},
    low:   {key:'low',    label:'부족', tone:'red'}
  };
  var QUOTA_RANK = { free:0, normal:1, low:2 };

  /* =========================================================
     상태
     ========================================================= */
  var state = {
    token: readLS(TOKEN_KEY) || '',
    live: null,
    loading: false,
    filter: null,
    conn: 'snapshot',
    items: [],
    localItems: [],
    renderedIssues: {},
    quota: null,
    quotaTimer: null,
    clearedAt: (function(){
      var v = parseInt(readLS(CLEAR_KEY) || '', 10);
      return (v > 0) ? v : 0;
    })(),
    prefs: (function(){
      try { return JSON.parse(readLS(PREF_KEY) || '{}'); } catch(e){ return {}; }
    })()
  };
  state.quota = loadQuota();

  /* =========================================================
     작은 유틸
     ========================================================= */
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function readLS(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function writeLS(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  function delLS(k){ try { localStorage.removeItem(k); } catch(e){} }

  var KST = 'Asia/Seoul';
  function fmtTime(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    try {
      return new Intl.DateTimeFormat('ko-KR', {hour:'numeric', minute:'2-digit', hour12:true, timeZone:KST}).format(d);
    } catch(e){
      return d.getHours() + ':' + ('0'+d.getMinutes()).slice(-2);
    }
  }
  function dayKey(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    try {
      return new Intl.DateTimeFormat('en-CA', {timeZone:KST, year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
    } catch(e){ return d.toISOString().slice(0,10); }
  }
  function dayLabel(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    try {
      return new Intl.DateTimeFormat('ko-KR', {timeZone:KST, year:'numeric', month:'long', day:'numeric', weekday:'short'}).format(d);
    } catch(e){ return dayKey(iso); }
  }
  function nowISO(){ return new Date().toISOString(); }
  function shortSha(s){ return String(s||'').slice(0,7); }

  /* =========================================================
     한도 여유 저장 · 04:00 KST 자동 리셋
     · 기준 하루는 ‘04:00에 시작하는 날’ — 새벽 4시가 지나면 전날 수동 설정은 사라진다
     ========================================================= */
  function kstParts(d){
    var parts = {year:'0000', month:'01', day:'01', hour:'00', minute:'00', second:'00'};
    try {
      new Intl.DateTimeFormat('en-US', {
        timeZone:'Asia/Seoul', hour12:false,
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit'
      }).formatToParts(d).forEach(function(p){
        if (p.type !== 'literal' && parts.hasOwnProperty(p.type)) parts[p.type] = p.value;
      });
    } catch(e){}
    parts.hour = String(Number(parts.hour) % 24);
    if (parts.hour.length < 2) parts.hour = '0' + parts.hour;
    return parts;
  }
  function quotaDay(ts){
    var d = new Date((ts == null ? Date.now() : ts) - QUOTA_HOUR * 3600000);
    var p = kstParts(d);
    return p.year + '-' + p.month + '-' + p.day;
  }
  function msToNextReset(){
    var p = kstParts(new Date());
    var cur  = ((Number(p.hour) * 60) + Number(p.minute)) * 60 + Number(p.second);
    var at   = QUOTA_HOUR * 3600;
    var diff = at - cur;
    if (diff <= 0) diff += 86400;
    return diff * 1000 + 1500;
  }
  function defaultQuota(){ return {state:'free', pct:null}; }
  function loadQuota(){
    var data = null;
    try { data = JSON.parse(readLS(QUOTA_KEY) || 'null'); } catch(e){ data = null; }
    var map = {};
    var today = quotaDay();
    if (data && data.day === today && data.map && typeof data.map === 'object'){
      Object.keys(data.map).forEach(function(k){
        var v = data.map[k] || {};
        var st = QUOTA_STATES[v.state] ? v.state : 'free';
        var pct = (typeof v.pct === 'number' && isFinite(v.pct) && v.pct >= 0 && v.pct <= 100)
          ? Math.round(v.pct) : null;
        map[k] = {state:st, pct:pct};
      });
    }
    ORDER.forEach(function(k){ if (!map[k]) map[k] = defaultQuota(); });
    return {day: today, map: map, resetFrom: (!data || data.day !== today) ? (data ? data.day : null) : null};
  }

    writeLS(QUOTA_KEY, JSON.stringify({
      day: state.quota.day,
      map: state.quota.map
    }));

  function persistQuota(){
    state.quota.day = quotaDay();
    saveQuota();

  function quotaOf(key){

  function quotaText(q){

  function resetQuotaIfNeeded(notify){

    if (state.quota.day === today) return false;

  /* =========================================================
     피클별 일감 수 (owner:* 라벨 · 미완료 open)
     ========================================================= */
  function countsByOwner(){
    var c = {};
    ORDER.forEach(function(k){ c[k] = {open:0, todo:0, doing:0, done:0}; });
    if (state.live){
      state.live.issues.forEach(function(i){
        var o = ownerOfIssue(i);
        if (!o || !c[o]) return;
        var st = statusOfIssue(i) || 'todo';
        if (st === 'done' || i.state === 'closed'){ c[o].done++; return; }
        c[o].open++;
        if (st === 'doing') c[o].doing++; else c[o].todo++;
      });
    }
    return c;
  }

  /* =========================================================
     자동(여유) 배정 계산
     ① 부족 제외 ② 여유 > 보통 ③ 같은 등급 안에서 잔여 % 높은 순 ④ 일감 적은 순
     모두 부족이면 → 일감이 가장 적은 팀원으로 폴백(안내 문구 노출)
     ========================================================= */
  function autoPick(){
    var counts = countsByOwner();
    var pool = AUTO_POOL.map(function(k){
      var q = quotaOf(k);
      return {
        key:k, q:q,
        rank: (QUOTA_RANK[q.state] == null ? 0 : QUOTA_RANK[q.state]),
        pct: (q.pct == null ? -1 : q.pct),
        open: (state.live ? counts[k].open : 0)
      };
    });
    var usable = pool.filter(function(x){ return x.q.state !== 'low'; });
    var allLow = usable.length === 0;
    var list = (allLow ? pool.slice() : usable);
    list.sort(function(a, b){
      if (!allLow && a.rank !== b.rank) return a.rank - b.rank;
      if (a.pct !== b.pct) return b.pct - a.pct;
      if (a.open !== b.open) return a.open - b.open;
      return ORDER.indexOf(a.key) - ORDER.indexOf(b.key);
    });
    var pick = list[0];
    return {
      key: pick.key,
      state: pick.q.state,
      pct: pick.q.pct,
      open: pick.open,
      allLow: allLow,
      known: !!state.live,
      counts: counts
    };
  }

  /* =========================================================
     GitHub API
     ========================================================= */
  function gh(path, opts){
    opts = opts || {};
    var headers = {
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    };
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body) headers['Content-Type'] = 'application/json';

    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: 'no-store'
    }).then(function(res){
      if (!res.ok){
        return res.text().then(function(t){
          var parsed = null;
          try { parsed = JSON.parse(t); } catch(e){}
          var err = new Error('HTTP ' + res.status + (parsed && parsed.message ? ' · ' + parsed.message : ''));
          err.status = res.status;
          err.detail = parsed;
          throw err;
        });
      }
      return res.json();
    });
  }

  function loadLive(quiet){
    if (!state.token){
      renderLiveBar();
      return Promise.resolve(false);
    }
    if (state.loading) return Promise.resolve(false);
    state.loading = true;
    setRefreshSpin(true);

    var jobs = [
      gh('/repos/' + REPO + '/issues?state=all&per_page=30&sort=updated'),
      gh('/repos/' + REPO + '/issues/comments?sort=created&direction=desc&per_page=50'),
      gh('/repos/' + REPO + '/commits?per_page=10'),
      gh('/repos/' + REPO + '/git/trees/main?recursive=1')
    ];

    return Promise.all(jobs.map(function(p){ return p.then(function(v){ return {ok:true, v:v}; },
                                                              function(e){ return {ok:false, e:e}; }); }))
      .then(function(res){
        var issues = res[0].ok ? res[0].v : null;
        var comments = res[1].ok ? res[1].v : null;
        var commits = res[2].ok ? res[2].v : null;
        var tree = res[3].ok ? res[3].v : null;

        var failed = res.filter(function(r){ return !r.ok; })[0];
        if (failed && (failed.e.status === 401 || failed.e.status === 404)){
          state.live = null;
          state.loading = false;
          setRefreshSpin(false);
          renderLiveBar(failed.e);
          if (!quiet) {
            toast(failed.e.status === 401
              ? '토큰이 유효하지 않습니다. 🔑에서 다시 설정해 주세요.'
              : '이 토큰으로 저장소에 접근할 수 없습니다. 권한을 확인해 주세요.', 'err');
          }
          return false;
        }

        var list = (issues || []).filter(function(i){ return !i.pull_request; });
        var base = comments || [];

        // 최근 50건 밖에 있는 이슈는 이슈별 댓글을 따로 받아 보완한다
        var have = {};
        base.forEach(function(c){ var n = commentIssueNo(c); if (n) have[n] = 1; });
        var need = list.filter(function(i){
          return (i.comments || 0) > 0 && !have[i.number];
        }).slice(0, 8);

        return Promise.all(need.map(function(i){
          return gh('/repos/' + REPO + '/issues/' + i.number + '/comments?per_page=100&sort=created')
            .then(function(v){ return v || []; }, function(){ return []; });
        })).then(function(parts){
          var all = base.slice();
          parts.forEach(function(p){ all = all.concat(p); });
          var seen = {}, merged = [];
          all.forEach(function(c){
            if (!c || c.id == null) return;
            var k = String(c.id);
            if (seen[k]) return;
            seen[k] = 1;
            merged.push(c);
          });
          merged.sort(function(a,b){ return new Date(a.created_at) - new Date(b.created_at); });

          state.live = {
            issues: list,
            comments: merged,
            commits: commits || [],
            files: ((tree && tree.tree) || []).filter(function(f){ return f.type === 'blob' && f.path.indexOf('outputs/') === 0 && f.path !== 'outputs/.gitkeep'; }),
            at: nowISO()
          };
          writeLS(TS_KEY, state.live.at);
          state.loading = false;
          setRefreshSpin(false);
          buildItems();
          render();
          renderMembers();
          renderLiveBar();
          if (!quiet) toast('GitHub에서 새로고침했습니다 · 댓글 ' + merged.length + '건', 'ok');
          return true;
        });
      })
      .catch(function(e){
        state.loading = false;
        setRefreshSpin(false);
        renderLiveBar(e);
        if (!quiet) toast('동기화 실패 · ' + (e.message || '네트워크 오류'), 'err');
        return false;
      });
  }

  function statusOfIssue(i){
    var names = (i.labels || []).map(function(l){ return typeof l === 'string' ? l : l.name; });
    if (names.indexOf('status:done') >= 0) return 'done';
    if (names.indexOf('status:doing') >= 0) return 'doing';
    if (names.indexOf('status:todo') >= 0) return 'todo';
    return null;
  }
  function ownerOfIssue(i){
    var names = (i.labels || []).map(function(l){ return typeof l === 'string' ? l : l.name; });
    for (var k = 0; k < names.length; k++){
      if (names[k].indexOf('owner:') === 0){
        var h = names[k].slice(6);
        if (PEOPLE[h]) return h;
      }
    }
    return null;
  }
  /* 댓글 → 피클 매핑
     · 말머리 [손디]/[대장] = 대장(ㅅ) · [벨벳] = 벨벳(ㅂ) · [엄마] = 엄마(ㅇ) · [3번] = 3번(3)
     · 말머리가 없으면 그 이슈의 owner:* 라벨(또는 assignee)을 따르고, 그것도 없으면 대장 */
  var HEAD_MAP = [
    {key:'sonseonghun1', re:/(손디|대장)/},
    {key:'belbes8',      re:/(벨벳)/},
    {key:'eomma70',      re:/(엄마)/},
    {key:'sond3',        re:/(3번)/}
  ];
  function headKey(node){
    var t = String(node || '').trim();
    if (!t) return null;
    for (var i = 0; i < HEAD_MAP.length; i++){
      if (HEAD_MAP[i].re.test(t)) return HEAD_MAP[i].key;
    }
    return null;
  }
  function headOf(text, rows){
    var lines = String(text || '').split('\n');
    var picked = lines.slice(0, rows || 1).join('\n');
    var m = /[\[\(（]\s*(손디|대장|벨벳|엄마|3번)\s*[\]\)）]/.exec(picked);
    return m ? headKey(m[1]) : null;
  }
  function assigneesOf(i){
    return ((i && i.assignees) || []).map(function(a){ return a && a.login; })
      .filter(function(l){ return l && PEOPLE[l]; });
  }
  function whoFromComment(body, issue){
    // 1) 댓글 맨 앞 말머리  2) 앞 두 줄의 말머리
    var key = headOf(body, 1) || headOf(body, 2);
    if (key) return key;
    // 3) 이슈 담당(owner:* 라벨 → assignee)  4) 그래도 없으면 대장
    if (issue){
      var owner = ownerOfIssue(issue);
      if (owner) return owner;
      var asg = assigneesOf(issue);
      if (asg.length) return asg[0];
    }
    return 'sonseonghun1';
  }
  /* ✋ 손들기 · ✅ 완료 · ▶ 착수를 말풍선에 표시 */
  function markOfComment(body){
    var head = String(body || '').split('\n').filter(function(x){ return x.trim(); })[0] || '';
    if (/✅/.test(head) || /완료했습니다/.test(head)) return {k:'done', label:'✅ 완료'};
    if (/✋/.test(head) || /(맡겠습니다|맡아서|손들)/.test(head)) return {k:'raise', label:'✋ 손들기'};
    if (/(🙌|착수|시작합니다)/.test(head)) return {k:'doing', label:'▶ 착수'};
    return null;
  }
  function commentIssueNo(cm){

          text: lead + i.title + (bodyFirst ? '\n' + bodyFirst.slice(0,140) : ''),
          card:{
            emoji: st === 'done' ? '✅' : (st === 'doing' ? '🛠' : '📥'),
            title:i.title,
            sub:'이슈 #' + i.number + (i.state === 'closed' ? ' · 닫힘' : ''),
            rows:[
              ['담당', PEOPLE[who].name + (asg.length ? ' · @' + asg[0] : '')],
              ['상태', st]
            ],
            link:{label:'이슈 #' + i.number + ' 열기', href:REPO_URL + '/issues/' + i.number}
          },
          chips: chips
        });
      });

      // 2) 실제 댓글 → 피클 말풍선 (✋ 손들기 / ✅ 완료 / ▶ 착수 표시)
      live.comments.forEach(function(cm){
        var num = commentIssueNo(cm);
        var iss = num ? (byNum[num] || null) : null;
        var who = whoFromComment(cm.body, iss);
        var chips = [];
        if (num) chips.push({type:'issue', n:Number(num), title: iss ? iss.title : '이슈 댓글'});
        items.push({
          kind:'msg', who:who, t:cm.created_at, live:true,
          mark: markOfComment(cm.body),
          text: plainFromMd(cm.body),
          chips: chips
        });
      });

      // 3) 결과물 파일 (최근 것만)
      if (live.files.length){
        var recent = live.files.slice(-6).reverse();
        items.push({
          kind:'msg', who:'sonseonghun1', t:live.at, live:true,
          text:'결과물 폴더에 ' + live.files.length + '개 파일이 있습니다. 🗂 버튼에서 전체를 볼 수 있어요.',
          chips: recent.slice(0,3).map(function(f){ return {type:'file', path:f.path}; })
        });
      }
    }

    // 이 웹앱에서 방금 보낸 지시(로컬 반향) — 실시간 이슈가 확인되면 접수 말풍선은 접는다
    (state.localItems || []).forEach(function(it){
      if (it.echoOf && live){
        var hit = live.issues.some(function(i){ return i.number === it.echoOf; });
        if (hit) return;
      }
      items.push(it);
    });

    items.sort(function(a,b){ return itemTs(a) - itemTs(b); });
    state.items = items;
  }

  function plainFromMd(md){
    var out = String(md || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/^#{1,6}\s*/gm, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s*[-*]\s+/gm, '· ')
      .replace(/^\s*\|.*\|\s*$/gm, '')
      .replace(/\n{3,}/g, '\n\n')
      .replace(/^—.*$/gm, '')
      .trim();
    return out.length > 460 ? out.slice(0, 460) + '…' : out;
  }

  function chipHTML(c){
    if (c.type === 'issue'){
      var url = REPO_URL + '/issues/' + c.n;
      return '<a class="chip chip-issue" href="' + url + '" target="_blank" rel="noopener">#' + c.n +
        (c.title ? ' ' + esc(c.title) : '') + ' ↗</a>';
    }
    if (c.type === 'commit'){
      return '<a class="chip chip-commit" href="' + REPO_URL + '/commit/' + esc(c.sha) + '" target="_blank" rel="noopener">⎇ ' + esc(shortSha(c.sha)) + '</a>';
    }
    if (c.type === 'status'){
      return '<span class="chip st-' + esc(c.v) + '">' + esc(STATUS_TXT[c.v] || c.v) + '</span>';
    }
    if (c.type === 'label'){
      return '<span class="chip chip-label">' + esc(c.v) + '</span>';
    }
    if (c.type === 'file'){
      var name = String(c.path).replace(/^outputs\//,'');
      return '<a class="chip" href="' + REPO_URL + '/blob/main/' + encodeURI(c.path) + '" target="_blank" rel="noopener">📄 ' + esc(name) + '</a>';
    }
    return '';
  }

  function bubbleText(t){
    var safe = esc(t);
    safe = safe.replace(/`([^`]+)`/g, '<span class="em">$1</span>');
    return safe.split('\n').map(function(line){ return '<p>' + (line || '&nbsp;') + '</p>'; }).join('');
  }

    var tl = $('timeline');
    var stick = nearBottom();
    var clearedAt = state.clearedAt || 0;
    var hidden = 0;
    var filtered = [];
    state.items.forEach(function(it, idx){
      if (clearedAt && itemTs(it) < clearedAt){ hidden++; return; }
      if (!state.filter) { filtered.push({it:it, i:idx}); return; }
      if (it.kind === 'msg' && it.who === state.filter) filtered.push({it:it, i:idx});
    });

    var out = [];

    // 안내 카드 (맨 위)
    if (!state.token){
      out.push('<div class="sys">' +
        '<span class="ico" aria-hidden="true">🔑</span>' +
        '<div><b>내장 스냅샷으로 보고 있어요.</b> 2026-11-28 15:47 기준 저장소 상태입니다. ' +
        'GitHub 토큰을 한 번 넣어 두면 이 방이 실시간으로 바뀌고, 아래 입력창의 지시가 실제 이슈로 올라갑니다.' +

        '<span class="ico" aria-hidden="true">🛰</span>' +
        '<div><b>실시간 연결됨.</b> ' + esc(stats.line) +
        '<div class="btn-row"><button class="mini" data-act="refresh">🔄 새로고침</button></div></div></div>');
    }

    // 비우기 배지
    if (clearedAt){
      out.push('<div class="clearedbar" data-act="unclear" role="button" tabindex="0" title="눌러서 이전 대화 다시 보기">' +
        '<span aria-hidden="true">🧹</span>' +
        '<span>' + (hidden ? '이전 대화 ' + hidden + '건 숨김' : '이전 대화를 비웠어요') + '</span>' +
        '<button class="undo" type="button" data-act="unclear">다시 보기</button>' +
      '</div>');
    }

    if (!filtered.length){
      var emptyMsg;
      if (state.filter){
        emptyMsg = esc(PEOPLE[state.filter].name) + ' 피클의 말풍선이 아직 없습니다.<br>아래에서 첫 지시를 보내 보세요.';
      } else if (state.live){
        emptyMsg = clearedAt
          ? '이전 대화를 모두 숨겼습니다.<br>새 소식이 오면 여기부터 쌓입니다.'
          : '저장소에 올라온 일감·댓글이 아직 없습니다.<br>아래 입력창에서 첫 지시를 보내 보세요.';
      } else if (clearedAt){
        emptyMsg = '이전 대화를 모두 숨겼습니다.';
      } else {
        emptyMsg = '아직 말풍선이 없습니다.';
      }
      out.push('<div class="empty"><span class="big">💬</span>' + emptyMsg + '</div>');
      tl.innerHTML = out.join('');
      renderFilterBar();
      if (stick) scrollBottom(true);
      return;
    }
    var lastDay = '';

    filtered.forEach(function(rec){
      var it = rec.it, mi = rec.i;
      var dk = dayKey(it.t);
      if (dk && dk !== lastDay){
        out.push('<div class="day">' + esc(dayLabel(it.t)) + '</div>');
        lastDay = dk;
      }

      if (it.kind === 'msg'){
        var p = PEOPLE[it.who] || PEOPLE.sonseonghun1;
        out.push('<div class="msg" data-who="' + it.who + '">' +
          '<span class="av">' + pickleSVG(p, 27) + '</span>' +
          '<div class="bd">' +
            '<div class="who">' +
              '<b>' + (p.rainbow ? '🌈 ' : '') + esc(p.name) + '</b>' +
              '<span class="t">' + esc(fmtTime(it.t)) + '</span>' +
              (it.live ? '<span class="h">· 실시간</span>' : '') +
            '</div>' +
            '<div class="bubble' + (it.card ? ' is-card' : '') + (it.mark ? ' mk-' + it.mark.k : '') + '">' +
              (it.mark ? '<span class="mk mk-' + it.mark.k + '">' + esc(it.mark.label) + '</span>' : '') +
              (it.card ? cardHTML(it.card) : bubbleText(it.text)) +
              (it.chips && it.chips.length
                ? '<div class="chips">' + it.chips.map(chipHTML).join('') + '</div>'
                : '') +
            '</div>' +
            reactsHTML(it, mi) +
          '</div>' +
        '</div>');
      } else if (it.kind === 'me'){
        out.push('<div class="msg me">' +
          '<div class="bd">' +
            '<div class="who"><b>성훈님</b><span class="t">' + esc(fmtTime(it.t)) + '</span></div>' +
            '<div class="bubble">' + bubbleText(it.text) +
              (it.chips && it.chips.length
                ? '<div class="chips">' + it.chips.map(chipHTML).join('') + '</div>'
                : '') +
            '</div>' +
            reactsHTML(it, mi) +
          '</div>' +
        '</div>');
      }
    });

    tl.innerHTML = out.join('');
    renderFilterBar();
    if (stick) scrollBottom(true);

  /* =========================================================

  function liveStats(){
    var live = state.live;
    if (!live) return {line:'', issues:0, commits:0, files:0};
    var c = {todo:0, doing:0, done:0};
    live.issues.forEach(function(i){
      var st = statusOfIssue(i) || (i.state === 'closed' ? 'done' : 'todo');
      c[st]++;
    });
    var line = '이슈 ' + live.issues.length + ' · todo ' + c.todo +
      (c.doing ? ' · doing ' + c.doing : '') +
      (c.done ? ' · done ' + c.done : '') +
      ' · 댓글 ' + (live.comments || []).length +
      ' · 결과물 ' + live.files.length;
    return {line:line, issues:live.issues.length, comments:(live.comments || []).length, files:live.files.length};
  }

    var bar = $('liveBar');
    var txt = $('liveTxt');
    var act = $('liveAct');
    if (state.token && state.live && !err){
      state.conn = 'live';
      bar.classList.add('live');
      txt.innerHTML = '<b>실시간</b> · ' + esc(liveStats().line) + ' <span class="sep">·</span> ' + esc(fmtTime(state.live.at)) + ' 동기화';
      act.textContent = '새로고침';
      $('btnToken').classList.add('on');
      renderHint();
      return;
    }
    bar.classList.remove('live');
    if (err){
      state.conn = 'err';
      txt.innerHTML = '<b style="color:#A33">동기화 실패</b> · ' + esc(err.status ? 'HTTP ' + err.status : '네트워크') + ' · 🔑에서 토큰을 확인해 주세요';
      act.textContent = '토큰 설정';
      renderHint();
      return;
    }
    if (state.token && !state.live){
      state.conn = 'saved';
      txt.innerHTML = '토큰 저장됨 · 아직 동기화 전 · 🔄를 눌러 주세요';
      act.textContent = '새로고침';
      $('btnToken').classList.add('on');
      renderHint();
      return;

    state.conn = 'snapshot';
    txt.innerHTML = '내장 스냅샷 · 11-28 15:47 기준 · 토큰을 연결하면 실시간';

  function copyText(txt){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(txt).then(function(){ return true; }, function(){ return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  /* =========================================================
     이슈 만들기
     ========================================================= */
  function composePayload(text, target, project){
    if (target === 'auto') target = autoPick().key;
    var firstLine = (text.split('\n')[0] || '').trim();
    var shortTitle = firstLine.length > 56 ? firstLine.slice(0, 56) + '…' : firstLine;
    var prefix;
    if (target === 'all') prefix = '[공용] ';
    else prefix = TARGET_LABEL[target] + ' ';

    var labels = ['status:todo'];
    if (target !== 'all') labels.unshift('owner:' + target);
    if (project !== 'general') labels.push('project:' + project);

    var who = target === 'all'
      ? '전체 (대장이 분배)'
      : TARGET_LABEL[target] + ' · ' + (PEOPLE[target] ? PEOPLE[target].handle : '');
    var now = new Intl.DateTimeFormat('ko-KR', {timeZone:KST, dateStyle:'medium', timeStyle:'short'}).format(new Date());

    var body =
      '## 무엇을\n\n' + text + '\n\n' +
      '## 요청 정보\n\n' +
      '| 항목 | 값 |\n|---|---|\n' +
      '| 담당 | ' + who + ' |\n' +
      '| 프로젝트 | ' + PROJECT_LABEL[project] + ' |\n' +
      '| 요청자 | 성훈님 |\n' +
      '| 등록 | 대장 채팅방 웹앱 · ' + now + ' |\n\n' +
      '## 끝났다고 보는 상태\n\n' +
      '- [ ] 결과물 파일: `outputs/' + (project === 'general' ? '<프로젝트>' : project) + '/<YYYY-MM-DD>-<주제>.md`\n' +
      '- [ ] 이슈 댓글에 결과물 경로와 한 줄 요약 보고\n' +
      '- [ ] 총괄 대장 검수 후 `status:done`\n';

    return {title: prefix + shortTitle, body: body, labels: labels};
  }

  function sendInstruction(){
    var text = $('msg').value.trim();
    var sel = $('selTarget').value;
    var autoInfo = (sel === 'auto') ? autoPick() : null;
    var target = autoInfo ? autoInfo.key : sel;
    var project = $('selProject').value;

    if (!text){ toast('지시 내용을 입력해 주세요'); $('msg').focus(); return; }
    if (!state.token){
      toast('GitHub 토큰을 연결하면 바로 이슈로 올릴 수 있어요');
      openDraft(text, target, project, null, autoInfo);
      return;
    }

    var payload = composePayload(text, target, project);
    var btn = $('btnSend');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner">↻</span>';

    gh('/repos/' + REPO + '/issues', {method:'POST', body: payload})
      .then(function(issue){
        state.renderedIssues[issue.number] = 1;
        addSent(text, target, project, issue, autoInfo);
        $('msg').value = '';
        autoGrow();
        toast('✅ ' + (autoInfo ? '자동 배정 → ' + PEOPLE[target].name + ' · ' : '') +
          (target === 'all' ? '[공용] ' : TARGET_LABEL[target] + ' ') + '이슈 #' + issue.number + ' 생성 완료', 'ok');
        loadLive(true);
      })
      .catch(function(e){
        var m = '이슈 생성 실패';
        if (e.status === 401) m = '토큰이 유효하지 않습니다. 🔑에서 다시 설정해 주세요.';
        else if (e.status === 403) m = '권한 또는 호출 한도 문제입니다(403). 토큰 권한에 Issues 쓰기가 있는지 확인해 주세요.';
        else if (e.status === 404) m = '저장소에 접근할 수 없습니다(404). 토큰의 저장소 접근을 확인해 주세요.';
        else if (e.status === 422) m = '라벨/입력값이 거부되었습니다(422). 잠시 후 다시 시도해 주세요.';
        else if (e.message) m = '이슈 생성 실패 · ' + e.message;
        toast(m, 'err');
        if (e.status === 401) openToken();
      })
      .then(function(){
        btn.disabled = false;
        btn.textContent = '↑';
      });
  }

  function addSent(text, target, project, issue, autoInfo){
    var t = nowISO();
    var whoTxt = (target === 'all' ? '[공용]' : TARGET_LABEL[target]);
    var me = {
      kind:'me', t:t, text:text,
      chips:[
        {type:'label', v: autoInfo ? ('자동 배정 → ' + whoTxt) : whoTxt},
        {type:'label', v: PROJECT_LABEL[project]},
        {type:'issue', n:issue.number, title:'방금 생성'}
      ]
    };
    var ack = {
      kind:'msg', who:'sonseonghun1', t:t, echoOf:issue.number,
      text:'지시 접수 — ' + whoTxt + ' 이슈로 올렸습니다.' +
        (autoInfo ? ' 한도 여유 기준 자동 배정으로 ' + PEOPLE[target].name + '에게 배정했습니다.' : '') +
        ' 담당 피클이 확인하면 status:doing으로 바꾸고 결과물을 outputs/에 남깁니다.',
      chips:[
        {type:'issue', n:issue.number, title:issue.title || ''},
        {type:'status', v:'todo'}
      ],
      react:[{e:'🙌', n:1}]
    };
    state.localItems.push(me, ack);
    state.items.push(me, ack);
    render();
    scrollBottom(true);
  }

  // 시트 안 버튼 위임
  $('sheetBody').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'qstate'){
      var qs = b.getAttribute('data-q');

      state.quota.map[sheetWho].state = qs;
      persistQuota();

      toast(PEOPLE[sheetWho].name + ' 한도 = ' + QUOTA_STATES[qs].label +
        (state.quota.map[sheetWho].pct == null ? '' : ' ' + state.quota.map[sheetWho].pct + '%'));
      return;
    }
    if (act === 'token'){ closeSheet(); setTimeout(openToken, 120); return; }
    if (act === 'outputs'){ closeSheet(); setTimeout(openOutputs, 120); return; }
    if (act === 'refresh'){ closeSheet(); loadLive(false); return; }
    if (act === 'filter'){
      state.filter = b.getAttribute('data-who');
      closeSheet();
      renderMembers();
      var chip = document.querySelector('.critter[data-who="' + state.filter + '"]');
      if (chip && chip.scrollIntoView) chip.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
      render();

      return;
    }
    if (act === 'assign'){
      closeSheet();
      $('selTarget').value = b.getAttribute('data-who');
      savePrefs();
      $('msg').focus();
      toast(PEOPLE[$('selTarget').value].name + ' 앞으로 일감을 적어 보내세요');
      return;
    }
    if (act === 'copy'){
      var txt = b.getAttribute('data-prompt');
      copyText(txt).then(function(ok){
        toast(ok ? '📋 복사했습니다. 이 방에 붙여넣어 주세요.' : '복사가 막혔습니다. 아래 내용을 길게 눌러 복사해 주세요.', ok ? 'ok' : 'err');
        if (!ok) showRawPrompt(txt);
      });
      return;
    }
    if (act === 'saveToken'){
      var v = ($('tokInput').value || '').trim();
      if (!v){ toast('토큰 값을 붙여넣어 주세요', 'err'); return; }
      if (!/^(gh[pousr]_|github_pat_)/.test(v)){ toast('토큰 형식이 아닙니다 (github_pat_… 또는 ghp_…)', 'err'); return; }
      state.token = v;
      if (!writeLS(TOKEN_KEY, v)){ toast('이 브라우저에 저장할 수 없습니다(시크릿 모드일 수 있어요)', 'err'); }
      closeSheet();
      toast('토큰 저장 · GitHub에서 불러옵니다…');
      buildItems(); render(); renderMembers(); renderLiveBar();
      loadLive(false);
      return;
    }
    if (act === 'delToken'){
      state.token = '';
      delLS(TOKEN_KEY);
      state.live = null;
      closeSheet();
      buildItems(); render(); renderMembers(); renderLiveBar();
      toast('토큰을 삭제했습니다');
      return;
    }

  function showRawPrompt(txt){
    var d = document.createElement('div');
    d.className = 'note';
    d.style.marginTop = '10px';
    var ta = document.createElement('textarea');
    ta.readOnly = true;
    ta.value = txt;
    ta.style.cssText = 'width:100%;min-height:110px;border:1px solid #E2DFEE;border-radius:10px;padding:9px;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:vertical';
    d.appendChild(ta);
    $('sheetBody').appendChild(d);
    ta.focus(); ta.select();
  }

  // Esc
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !$('sheet').hidden) closeSheet();
  });

  // 타임라인 안의 안내 카드 버튼 위임
  $('timeline').addEventListener('click', function(e){
    var r = e.target.closest('[data-ri]');
    if (r){
      var mi = Number(r.getAttribute('data-mi'));
      var ri = Number(r.getAttribute('data-ri'));
      var it = state.items[mi];
      if (it && it.react && it.react[ri]){
        var rr = it.react[ri];
        rr.on = !rr.on;
        rr.n = Math.max(0, (rr.n || 0) + (rr.on ? 1 : -1));
        render();
      }
      return;
    }
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'token') openToken();
    if (act === 'outputs') openOutputs();
    if (act === 'refresh') loadLive(false);
    if (act === 'unclear') restoreTimeline();
  });

  /* =========================================================
     시작
     ========================================================= */
  function boot(){
    if (state.prefs.target && TARGET_LABEL[state.prefs.target]) $('selTarget').value = state.prefs.target;
    if (state.prefs.project && PROJECT_LABEL[state.prefs.project]) $('selProject').value = state.prefs.project;

    // 04:00 KST 지난 뒤 첫 방문이면 전날 수동 설정은 이미 ‘여유’로 돌아가 있다
    if (state.quota.resetFrom){
      saveQuota();
    }
    scheduleQuotaReset();

    if (state.clearedAt) $('btnClear').classList.add('on');

    buildItems();
    render();
    renderMembers();
    renderLiveBar();
    autoGrow();

    requestAnimationFrame(function(){
      scrollBottom(true);
      setTimeout(function(){ scrollBottom(true); }, 120);
    });

    if (state.token) loadLive(true);
  }

  // 탭으로 돌아왔을 때도 04:00 경계를 넘겼는지 확인
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) resetQuotaIfNeeded(false);
  });
  window.addEventListener('focus', function(){ resetQuotaIfNeeded(false); });

  boot();
})();
</script>
</body>
</html>
