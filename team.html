<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="피클팀 공용 작업방 — 대장과 3번·벨벳·나가 이슈로 일을 나누는 채팅형 작업판">
<title>🌈 대장 · 피클팀 공용 작업방</title>
<style>
  :root{
    --bg:#e9edf6;
    --app:#f6f8fc;
    --card:#ffffff;
    --card2:#f3f5fb;
    --line:#e5eaf3;
    --line2:#d5dceb;
    --text:#101828;
    --muted:#66738c;
    --muted2:#8b96ac;
    --violet:#6d3ff0;
    --violet2:#8f66ff;
    --violet-soft:#f1ecff;
    --violet-ink:#4c22c4;
    --todo:#a06b0a;  --todo-bg:#fdf4d8;
    --doing:#1a63c9; --doing-bg:#e4efff;
    --done:#0b7a3f;  --done-bg:#e2f6ea;
    --green:#12a150;
    --amber:#c98111;
    --shadow:0 10px 30px rgba(16,24,40,.07);
    --r:18px;
    --hd:auto;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(143,102,255,.16), transparent 62%),
      radial-gradient(760px 420px at 104% 4%, rgba(255,178,90,.14), transparent 60%),
      radial-gradient(700px 420px at 50% 108%, rgba(80,200,180,.12), transparent 62%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.5;
    min-height:100vh;
    overflow-x:hidden;
    overflow-wrap:anywhere;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(109,63,240,.18)}

  /* ============ app frame ============ */
  .app{
    width:100%;max-width:880px;margin:0 auto;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    background:var(--app);
    position:relative;
    overflow:hidden;
  }
  @media (min-width:861px){
    body{padding:24px 16px}
    .app{
      height:min(920px, calc(100dvh - 48px));
      border-radius:26px;
      box-shadow:0 30px 70px rgba(16,24,40,.16), 0 2px 0 rgba(255,255,255,.8) inset;
      border:1px solid rgba(255,255,255,.9);
    }
  }

  /* ============ header ============ */
  header.hd{
    position:relative;z-index:20;flex:0 0 auto;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  header.hd::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,#ff5d5d,#ffa93b,#ffe14d,#4ad07a,#48b7ff,#8f66ff,#ff5d5d);
    opacity:.55;
    background-size:200% 100%;
    animation:slide 14s linear infinite;
  }
  @keyframes slide{from{background-position:0 0}to{background-position:200% 0}}
  @media (prefers-reduced-motion:reduce){
    header.hd::after{animation:none}
    *{scroll-behavior:auto !important}
  }

  .hd-in{display:flex;align-items:center;gap:11px;padding:11px 14px 9px}
  .logo{
    width:42px;height:42px;flex:0 0 auto;border-radius:14px;
    display:grid;place-items:center;font-size:23px;line-height:1;
    background:linear-gradient(150deg,#fff,#f3efff);
    border:1px solid #e8e2ff;
    box-shadow:0 6px 18px rgba(109,63,240,.14), inset 0 1px 0 #fff;
  }
  .hd-txt{min-width:0;flex:1}
  .hd-txt h1{
    margin:0;font-size:18.5px;font-weight:850;letter-spacing:-.03em;
    display:flex;align-items:center;gap:7px;line-height:1.25;
  }
  .hd-txt h1 .tag{
    font-size:10.5px;font-weight:800;letter-spacing:0;
    background:var(--violet-soft);color:var(--violet-ink);
    border:1px solid #e0d6ff;border-radius:999px;padding:2px 7px;
  }
  .hd-txt p{
    margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;overflow-wrap:anywhere;
  }
  .hd-act{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .icbtn{
    width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
    background:#fff;display:grid;place-items:center;font-size:15px;
    box-shadow:0 2px 6px rgba(16,24,40,.05);
    transition:transform .12s, background .12s;
  }
  .icbtn:active{transform:scale(.94)}
  .icbtn.on{background:var(--violet-soft);border-color:#ddd0ff}
  .icbtn.spin span{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============ team strip ============ */
  .team{
    display:flex;gap:7px;padding:2px 12px 10px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
  }
  .team::-webkit-scrollbar{display:none}
  @media (max-width:520px){
    .team{
      display:grid;grid-template-columns:1fr 1fr;gap:6px;
      overflow:visible;padding:2px 12px 9px;
    }
    .pm{width:100%;scroll-snap-align:none}
  }
  .pm{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:6px 10px 6px 6px;min-width:0;scroll-snap-align:start;
    box-shadow:0 2px 8px rgba(16,24,40,.04);
    transition:border-color .15s, box-shadow .15s, transform .12s;
  }
  .pm:active{transform:scale(.975)}
  .pm[aria-pressed="true"]{
    border-color:#c9b6ff;background:#fcfaff;
    box-shadow:0 4px 16px rgba(109,63,240,.15);
  }
  .pm .av{position:relative;flex:0 0 auto;line-height:0}
  .pm .av .dot{
    position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;
    background:#fff;display:grid;place-items:center;line-height:1;color:#fff;
    font-size:9px;font-weight:900;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    box-shadow:0 1px 3px rgba(16,24,40,.2);
  }
  .pm .av .dot.lead{background:var(--violet)}
  .pm .av .dot.ok{background:var(--green);font-size:8.5px}
  .pm .av .dot.wait{background:#fff;color:var(--amber);border:1.4px solid #ecc27c;font-size:10px}
  .pm-txt{min-width:0}
  .pm-name{
    font-size:12.5px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
    display:flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .pm-name .alias{font-size:9.5px;font-weight:700;color:var(--muted2)}
  .pm-st{
    font-size:10px;color:var(--muted);white-space:nowrap;line-height:1.35;
    display:flex;align-items:center;gap:3px;
  }
  .pm-st i{
    width:5px;height:5px;border-radius:50%;background:var(--green);flex:0 0 auto;
  }
  .pm-st.wait i{background:var(--amber)}

  /* ============ live bar ============ */
  .livebar{
    display:flex;align-items:center;gap:6px;
    padding:0 14px 8px;font-size:10.8px;color:var(--muted);
    min-height:22px;
  }
  .livebar .pip{
    width:6px;height:6px;border-radius:50%;background:var(--muted2);flex:0 0 auto;
  }
  .livebar.live .pip{
    background:var(--green);box-shadow:0 0 0 3px rgba(18,161,80,.15);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .livebar .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .livebar .txt b{font-weight:800;color:#334}
  .livebar .sep{color:var(--line2)}
  .livebar button{
    margin-left:auto;flex:0 0 auto;border:0;background:transparent;color:var(--violet);
    font-size:10.8px;font-weight:800;padding:2px 4px;border-radius:6px;
  }
  .livebar button:active{background:var(--violet-soft)}

  /* ============ timeline ============ */
  .tl{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:14px 13px 6px;
    display:flex;flex-direction:column;gap:10px;
    scroll-behavior:smooth;
  }
  .tl::-webkit-scrollbar{width:7px}
  .tl::-webkit-scrollbar-thumb{background:#d3daea;border-radius:9px}
  .tl::-webkit-scrollbar-track{background:transparent}

  .day{
    align-self:center;margin:6px 0 2px;
    background:rgba(255,255,255,.82);border:1px solid var(--line);
    color:var(--muted);font-size:10.5px;font-weight:700;
    padding:3px 11px;border-radius:999px;
  }

  .msg{display:flex;gap:8px;max-width:100%;align-items:flex-start}
  .msg .av{flex:0 0 auto;line-height:0;margin-top:1px}
  .bd{min-width:0;max-width:calc(100% - 42px);display:flex;flex-direction:column;gap:3px}
  .who{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    font-size:11px;color:var(--muted);line-height:1.3;
  }
  .who b{font-size:11.5px;font-weight:800;color:#2b3547;letter-spacing:-.01em}
  .who .h{font-size:10px;color:var(--muted2);font-weight:600}
  .who .t{font-size:10px;color:var(--muted2)}

  .bubble{
    background:var(--card);border:1px solid var(--line);
    border-radius:4px 15px 15px 15px;
    padding:9px 12px 10px;
    box-shadow:0 2px 8px rgba(16,24,40,.045);
    font-size:13.3px;line-height:1.55;color:#1b2434;
    max-width:min(100%, 60ch);
  }
  .bubble p{margin:0}
  .bubble p + p{margin-top:6px}
  .bubble .em{color:var(--violet);font-weight:800}
  .bubble b{font-weight:800}

  /* right side: 성훈님 지시 */
  .msg.me{justify-content:flex-end}
  .msg.me .bd{align-items:flex-end;max-width:calc(100% - 8px)}
  .msg.me .bubble{
    background:linear-gradient(160deg,#f3edff,#eae2ff);
    border-color:#dcd0ff;
    border-radius:15px 4px 15px 15px;
    color:#2a1a52;
    box-shadow:0 3px 12px rgba(109,63,240,.12);
  }
  .msg.me .who{flex-direction:row-reverse}
  .msg.me .who .t{order:-1}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{
    display:inline-flex;align-items:center;gap:4px;max-width:100%;
    font-size:10.6px;font-weight:750;line-height:1.35;
    border-radius:8px;padding:3px 7px;
    border:1px solid var(--line2);background:var(--card2);color:#43506b;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .12s;
  }
  a.chip:hover{background:#eef2fb}
  a.chip:active{background:#e6ecf8}
  .chip-issue{background:#eef4ff;border-color:#cfe0ff;color:#1a56b8;max-width:100%}
  .chip-commit{
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    letter-spacing:-.02em;background:#f4f5fa;border-color:#e0e4f0;color:#44506a;
  }
  .chip.st-todo{background:var(--todo-bg);border-color:#f0dda4;color:var(--todo)}
  .chip.st-doing{background:var(--doing-bg);border-color:#c4dcff;color:var(--doing)}
  .chip.st-done{background:var(--done-bg);border-color:#bfe8cd;color:var(--done)}
  .chip-label{background:#f6f2ff;border-color:#e2d8ff;color:#5b34c9}

  /* system / hint cards */
  .sys{
    align-self:center;width:100%;max-width:100%;
    background:linear-gradient(135deg,#fffdf7,#fff8ec);
    border:1px solid #f1e2c2;border-radius:14px;
    padding:11px 13px;display:flex;gap:9px;align-items:flex-start;
    font-size:12px;color:#6b5527;line-height:1.5;
  }
  .sys .ico{font-size:15px;line-height:1.2;flex:0 0 auto}
  .sys b{color:#4e3c15;font-weight:800}
  .sys .btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .sys button.mini{
    border:1px solid #e8d3aa;background:#fff;color:#7a5a12;
    font-size:11px;font-weight:800;border-radius:8px;padding:5px 9px;
  }
  .sys button.mini:active{background:#fdf3e2}

  .empty{
    margin:auto;text-align:center;color:var(--muted2);font-size:12.5px;
    padding:30px 12px;line-height:1.7;
  }
  .empty .big{font-size:30px;display:block;margin-bottom:6px;opacity:.75}

  /* ============ filter bar ============ */
  .filterbar{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    margin:0 12px 6px;padding:6px 8px 6px 11px;
    background:#fff;border:1px solid #ddd0ff;border-radius:11px;
    font-size:11.5px;font-weight:750;color:var(--violet-ink);
    box-shadow:0 2px 10px rgba(109,63,240,.08);
  }
  .filterbar .x{
    margin-left:auto;border:0;background:var(--violet-soft);color:var(--violet-ink);
    border-radius:7px;width:22px;height:22px;font-size:11px;font-weight:800;
  }

  /* ============ composer ============ */
  footer.cmp{
    flex:0 0 auto;position:relative;z-index:15;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:7px;
  }
  .cmp-row{display:flex;gap:7px;align-items:center}
  .selw{position:relative;flex:1 1 0;min-width:0}
  @media (min-width:641px){ .selw{flex:0 1 200px} }
  .selw::after{
    content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;
    border-right:1.6px solid var(--muted2);border-bottom:1.6px solid var(--muted2);
    transform:translateY(-70%) rotate(45deg);pointer-events:none;
  }
  select.pill{
    appearance:none;-webkit-appearance:none;
    width:100%;border:1px solid var(--line2);background:#fff;
    border-radius:11px;padding:9px 26px 9px 11px;
    font-size:12.5px;font-weight:750;color:#2b3547;
    text-overflow:ellipsis;
    box-shadow:0 1px 3px rgba(16,24,40,.04);
  }
  select.pill:focus-visible{outline:2px solid rgba(109,63,240,.45);outline-offset:1px}
  select.pill.tgt{color:var(--violet-ink);border-color:#ddd0ff;background:#fcfaff}

  .inputwrap{
    flex:1 1 auto;min-width:0;display:flex;align-items:flex-end;gap:7px;
    border:1px solid var(--line2);background:#fff;border-radius:15px;
    padding:6px 6px 6px 12px;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
  }
  .inputwrap:focus-within{border-color:#c9b6ff;box-shadow:0 0 0 3px rgba(109,63,240,.10)}
  #msg{
    flex:1 1 auto;min-width:0;border:0;background:transparent;outline:none;
    resize:none;font-size:13.5px;line-height:1.45;
    max-height:96px;padding:6px 0;overflow-y:auto;
  }
  #msg::placeholder{color:#9aa5ba}
  .send{
    flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:0;
    background:linear-gradient(160deg,var(--violet2),var(--violet));
    color:#fff;font-size:17px;font-weight:800;
    display:grid;place-items:center;
    box-shadow:0 6px 16px rgba(109,63,240,.32);
    transition:transform .12s, filter .12s;
  }
  .send:active{transform:scale(.93)}
  .send[disabled]{filter:grayscale(.5) opacity(.6);box-shadow:none}
  .send .spin{animation:spin .9s linear infinite}

  .cmp-hint{
    font-size:10.3px;color:var(--muted2);padding:0 2px;
    display:flex;align-items:center;gap:5px;min-height:13px;
  }
  .cmp-hint b{color:var(--violet-ink);font-weight:800}
  .cmp-hint .ok{color:var(--green);font-weight:800}

  /* ============ sheet ============ */
  .veil{
    position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.42);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    animation:fade .18s ease-out;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    position:fixed;z-index:61;left:0;right:0;bottom:0;
    max-height:88dvh;display:flex;flex-direction:column;
    background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -12px 40px rgba(16,24,40,.22);
    animation:up .24s cubic-bezier(.22,.9,.3,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
  @media (min-width:641px){
    .sheet{
      left:50%;right:auto;bottom:auto;top:50%;
      width:520px;max-width:calc(100vw - 32px);
      transform:translate(-50%,-50%);
      border-radius:20px;max-height:86dvh;
      animation:pop .18s ease-out;
    }
    @keyframes pop{from{transform:translate(-50%,-47%) scale(.985);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  }
  .sheet-grab{width:38px;height:4px;border-radius:99px;background:#e2e7f1;margin:8px auto 2px;flex:0 0 auto}
  @media (min-width:641px){.sheet-grab{display:none}}
  .sheet-h{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px 8px;flex:0 0 auto;
  }
  .sheet-h h2{margin:0;font-size:15.5px;font-weight:850;letter-spacing:-.02em;flex:1;min-width:0}
  .sheet-h .x{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--muted);font-size:13px;flex:0 0 auto;
  }
  .sheet-b{
    padding:2px 16px 18px;overflow-y:auto;min-height:0;flex:1 1 auto;
    -webkit-overflow-scrolling:touch;
  }
  @media (min-width:641px){.sheet-b{padding-bottom:20px}}

  /* sheet content bits */
  .mh{display:flex;gap:12px;align-items:center;padding:6px 0 12px}
  .mh-name{font-size:16px;font-weight:850;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mh-name .alias{font-size:11px;font-weight:800;color:var(--muted2);background:#f3f5fa;border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .mh-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kv{
    display:grid;grid-template-columns:auto 1fr;gap:6px 12px;
    background:var(--card2);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px;font-size:12px;margin-bottom:14px;
  }
  .kv dt{color:var(--muted);font-weight:700}
  .kv dd{margin:0;font-weight:750;color:#2b3547;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .okdot{color:var(--green);font-weight:800}
  .waitdot{color:var(--amber);font-weight:800}

  h3.sh{font-size:12px;font-weight:850;color:var(--muted);margin:16px 0 8px;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
  h3.sh .n{background:#f1f3f9;border:1px solid var(--line);border-radius:999px;padding:0 6px;font-size:10px;color:#4b566e}
  .ilist{display:flex;flex-direction:column;gap:7px}
  .irow{
    display:flex;gap:9px;align-items:flex-start;
    border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;
  }
  .irow .num{
    flex:0 0 auto;font-size:10.5px;font-weight:850;color:var(--violet-ink);
    background:var(--violet-soft);border-radius:7px;padding:2px 6px;margin-top:1px;
  }
  .irow .t{font-size:12.5px;font-weight:750;line-height:1.4;color:#1b2434}
  .irow .m{font-size:10.5px;color:var(--muted2);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .none{
    font-size:12px;color:var(--muted);background:var(--card2);
    border:1px dashed var(--line2);border-radius:12px;padding:12px;line-height:1.6;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--line2);background:#fff;color:#2b3547;
    border-radius:12px;padding:11px 14px;font-size:13px;font-weight:800;
    min-height:44px;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:linear-gradient(160deg,var(--violet2),var(--violet));
    border-color:transparent;color:#fff;
    box-shadow:0 8px 20px rgba(109,63,240,.28);
  }
  .btn.block{width:100%}
  .btn-row2{display:flex;gap:8px;margin-top:14px}
  .btn-row2 .btn{flex:1 1 0;min-width:0}

  .field{margin:12px 0 0}
  .field label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .field input[type=password], .field input[type=text]{

  var KST = 'Asia/Seoul';
  function fmtTime(iso){
    var d = new Date(iso);

    try {

    } catch(e){
      return d.getHours() + ':' + ('0'+d.getMinutes()).slice(-2);
    }
  }
  function dayKey(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    try {
      return new Intl.DateTimeFormat('en-CA', {timeZone:KST, year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
    } catch(e){ return d.toISOString().slice(0,10); }
  }
  function dayLabel(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    try {
      return new Intl.DateTimeFormat('ko-KR', {timeZone:KST, year:'numeric', month:'long', day:'numeric', weekday:'short'}).format(d);

  function nowISO(){ return new Date().toISOString(); }

     아바타 (피클 모양)

        'fill="url(#' + gid + ')" ' + (p.ok ? '' : 'opacity="0.55"') + '/>' +
      '<ellipse cx="17.1" cy="13.2" rx="2.9" ry="4.4" fill="#ffffff" opacity="0.32" transform="rotate(-20 17.1 13.2)"/>' +

  /* =========================================================

  /* =========================================================
     GitHub API
     ========================================================= */
  function gh(path, opts){
    opts = opts || {};
    var headers = {
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    };
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body) headers['Content-Type'] = 'application/json';

    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: 'no-store'
    }).then(function(res){
      if (!res.ok){
        return res.text().then(function(t){
          var parsed = null;
          try { parsed = JSON.parse(t); } catch(e){}
          var err = new Error('HTTP ' + res.status + (parsed && parsed.message ? ' · ' + parsed.message : ''));
          err.status = res.status;
          err.detail = parsed;
          throw err;
        });
      }
      return res.json();
    });
  }

  function loadLive(quiet){
    if (!state.token){
      renderLiveBar();
      return Promise.resolve(false);
    }
    if (state.loading) return Promise.resolve(false);
    state.loading = true;
    setRefreshSpin(true);

    var jobs = [
      gh('/repos/' + REPO + '/issues?state=all&per_page=30&sort=updated'),
      gh('/repos/' + REPO + '/issues/comments?per_page=50&sort=created'),
      gh('/repos/' + REPO + '/commits?per_page=10'),
      gh('/repos/' + REPO + '/git/trees/main?recursive=1')
    ];

    return Promise.all(jobs.map(function(p){ return p.then(function(v){ return {ok:true, v:v}; },
                                                              function(e){ return {ok:false, e:e}; }); }))
      .then(function(res){
        var issues = res[0].ok ? res[0].v : null;
        var comments = res[1].ok ? res[1].v : null;
        var commits = res[2].ok ? res[2].v : null;
        var tree = res[3].ok ? res[3].v : null;

        var failed = res.filter(function(r){ return !r.ok; })[0];
        if (failed && (failed.e.status === 401 || failed.e.status === 404)){
          state.live = null;
          state.loading = false;
          setRefreshSpin(false);
          renderLiveBar(failed.e);
          if (!quiet) {
            toast(failed.e.status === 401
              ? '토큰이 유효하지 않습니다. 🔑에서 다시 설정해 주세요.'
              : '이 토큰으로 저장소에 접근할 수 없습니다. 권한을 확인해 주세요.', 'err');
          }
          return false;
        }

        state.live = {
          issues: (issues || []).filter(function(i){ return !i.pull_request; }),
          comments: comments || [],
          commits: commits || [],
          files: ((tree && tree.tree) || []).filter(function(f){ return f.type === 'blob' && f.path.indexOf('outputs/') === 0 && f.path !== 'outputs/.gitkeep'; }),
          at: nowISO()
        };
        writeLS(TS_KEY, state.live.at);
        state.loading = false;
        setRefreshSpin(false);
        buildItems();
        render();
        renderMembers();
        renderLiveBar();
        if (!quiet) toast('GitHub에서 새로고침했습니다', 'ok');
        return true;
      })
      .catch(function(e){
        state.loading = false;
        setRefreshSpin(false);
        renderLiveBar(e);
        if (!quiet) toast('동기화 실패 · ' + (e.message || '네트워크 오류'), 'err');
        return false;
      });
  }

  function setRefreshSpin(on){

  function statusOfIssue(i){
    var names = (i.labels || []).map(function(l){ return typeof l === 'string' ? l : l.name; });
    if (names.indexOf('status:done') >= 0) return 'done';
    if (names.indexOf('status:doing') >= 0) return 'doing';
    if (names.indexOf('status:todo') >= 0) return 'todo';
    return null;
  }
  function ownerOfIssue(i){
    var names = (i.labels || []).map(function(l){ return typeof l === 'string' ? l : l.name; });
    for (var k = 0; k < names.length; k++){
      if (names[k].indexOf('owner:') === 0){
        var h = names[k].slice(6);
        if (PEOPLE[h]) return h;
      }
    }
    return null;
  }
  function guessAuthor(text){
    var head = String(text || '').split('\n')[0] || '';
    if (/벨벳/.test(head)) return 'belbes8';
    if (/3번/.test(head)) return 'sond3';
    if (/손디/.test(head)) return 'sonseonghun1';
    if (/벨벳/.test(text)) return 'belbes8';
    return 'sonseonghun1';
  }

  function buildItems(){
    var items = snapshotItems().concat(state.localItems || []);
    var live = state.live;

    if (live){
      // 새 커밋 (스냅샷에 없는 것)
      live.commits.forEach(function(c){
        var sha = (c.sha || '').slice(0,7);
        if (SNAP_COMMITS[sha]) return;
        if (state.renderedIssues['c:' + sha]) return;
        items.push({
          kind:'msg', who:'sonseonghun1', t:c.commit.author.date, live:true,
          text:'커밋 · ' + (c.commit.message || '').split('\n')[0],
          chips:[{type:'commit', sha:sha}]
        });
      });

      // 새 이슈 (스냅샷 #1 제외, 이 웹앱에서 만든 것 제외)
      live.issues.forEach(function(i){
        if (SNAP_ISSUES[i.number]) return;
        if (state.renderedIssues[i.number]) return;
        var who = ownerOfIssue(i) || 'sonseonghun1';
        var st = statusOfIssue(i);
        var chips = [{type:'issue', n:i.number, title:i.title}];
        if (st) chips.push({type:'status', v:st});
        var owner = ownerOfIssue(i);
        if (owner) chips.push({type:'label', v:'owner:' + owner});
        var bodyFirst = (i.body || '').split('\n').filter(function(x){ return x.trim() && !/^#|^\||^- \[/.test(x.trim()); })[0] || '';
        items.push({
          kind:'msg', who:who, t:i.created_at, live:true,
          text:'일감을 받았습니다 — ' + i.title + (bodyFirst ? '\n' + bodyFirst.slice(0,140) : ''),
          chips:chips
        });

        // 이슈 댓글
        live.comments.filter(function(cm){ return cm.issue_url && cm.issue_url.slice(-String(i.number).length - 1) === '/' + i.number; })
          .forEach(function(cm){
            items.push({
              kind:'msg', who:guessAuthor(cm.body), t:cm.created_at, live:true,
              text:plainFromMd(cm.body),
              chips:[{type:'issue', n:i.number, title:'댓글'}]
            });
          });
      });

      // 새 댓글 (스냅샷에 없는 것)
      live.comments.forEach(function(cm){
        var numMatch = /\/issues\/(\d+)$/.exec(cm.issue_url || '');
        if (!numMatch) return;
        var num = numMatch[1];
        if (!SNAP_ISSUES[num]) return;                    // 새 이슈 댓글은 위에서 처리
        var key = num + '|' + cm.created_at;
        if (SNAP_COMMENT_KEYS[key]) return;
        items.push({
          kind:'msg', who:guessAuthor(cm.body), t:cm.created_at, live:true,
          text:plainFromMd(cm.body),
          chips:[{type:'issue', n:Number(num), title:'댓글'}]
        });
      });

      // 결과물 파일 (최근 것만)
      if (live.files.length){
        var recent = live.files.slice(-6).reverse();
        items.push({
          kind:'msg', who:'sonseonghun1', t:live.at, live:true,
          text:'결과물 폴더에 ' + live.files.length + '개 파일이 있습니다. 🗂 버튼에서 전체를 볼 수 있어요.',
          chips: recent.slice(0,3).map(function(f){ return {type:'file', path:f.path}; })
        });
      }
    }

    items.sort(function(a,b){ return new Date(a.t) - new Date(b.t); });

    // 실시간 데이터가 있으면 스냅샷 말풍선의 이슈 제목·상태를 실제 값으로 맞춘다
    if (live){
      var byNum = {};
      live.issues.forEach(function(i){ byNum[i.number] = i; });
      items.forEach(function(it){
        if (!it.chips || !it.chips.length) return;
        var n = null;
        it.chips.forEach(function(c){ if (c.type === 'issue') n = c.n; });
        if (!n || !byNum[n]) return;
        it.chips.forEach(function(c){
          if (c.type === 'issue') c.title = byNum[n].title;
          if (c.type === 'status') c.v = statusOfIssue(byNum[n]) || c.v;
        });
      });
    }

    state.items = items;
  }

  function plainFromMd(md){
    var out = String(md || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/^#{1,6}\s*/gm, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s*[-*]\s+/gm, '· ')
      .replace(/^\s*\|.*\|\s*$/gm, '')
      .replace(/\n{3,}/g, '\n\n')
      .replace(/^—.*$/gm, '')
      .trim();
    return out.length > 460 ? out.slice(0, 460) + '…' : out;
  }

  function chipHTML(c){
    if (c.type === 'issue'){
      var url = REPO_URL + '/issues/' + c.n;
      return '<a class="chip chip-issue" href="' + url + '" target="_blank" rel="noopener">#' + c.n +
        (c.title ? ' ' + esc(c.title) : '') + ' ↗</a>';
    }
    if (c.type === 'commit'){
      return '<a class="chip chip-commit" href="' + REPO_URL + '/commit/' + esc(c.sha) + '" target="_blank" rel="noopener">⎇ ' + esc(shortSha(c.sha)) + '</a>';
    }
    if (c.type === 'status'){
      return '<span class="chip st-' + esc(c.v) + '">' + esc(STATUS_TXT[c.v] || c.v) + '</span>';
    }
    if (c.type === 'label'){
      return '<span class="chip chip-label">' + esc(c.v) + '</span>';
    }
    if (c.type === 'file'){
      var name = String(c.path).replace(/^outputs\//,'');
      return '<a class="chip" href="' + REPO_URL + '/blob/main/' + encodeURI(c.path) + '" target="_blank" rel="noopener">📄 ' + esc(name) + '</a>';
    }
    return '';
  }

  function bubbleText(t){
    // `code` → 코드풍, 줄바꿈 유지
    var safe = esc(t);
    safe = safe.replace(/`([^`]+)`/g, '<span class="em">$1</span>');
    return safe.split('\n').map(function(line){ return '<p>' + (line || '&nbsp;') + '</p>'; }).join('');
  }

  function liveStats(){
    var live = state.live;
    if (!live) return {line:'', issues:0, commits:0, files:0};
    var c = {todo:0, doing:0, done:0};
    live.issues.forEach(function(i){
      var st = statusOfIssue(i) || 'todo';
      c[st]++;
    });
    var line = '이슈 ' + live.issues.length + ' · todo ' + c.todo +
      (c.doing ? ' · doing ' + c.doing : '') +
      (c.done ? ' · done ' + c.done : '') +
      ' · 커밋 ' + live.commits.length + ' · 결과물 ' + live.files.length;
    return {line:line, issues:live.issues.length, commits:live.commits.length, files:live.files.length};
  }

      '공용 PC에서는 쓰지 마세요. 언제든 위 <b>삭제</b>로 지울 수 있습니다.</div>' +
      (saved ? '<div class="note">현재 토큰이 저장돼 있습니다. 새 값을 넣으면 교체됩니다.</div>' : '');

    openSheet(saved ? '🔑 GitHub 토큰 (연결됨)' : '🔑 GitHub 토큰 설정', html);
  }

  /* ── 결과물 시트 ── */
  function openOutputs(){
    var files = state.live ? state.live.files : [];
    var html;
    if (!state.token){
      html = '<div class="none">결과물 목록은 GitHub 토큰을 연결하면 실시간으로 보여줍니다.<br>' +
        '지금은 저장소의 <b>outputs/</b> 폴더를 직접 열어 보세요.' +
        '<div class="btn-row2"><button class="btn primary" data-act="token">🔑 GitHub 토큰 설정</button>' +
        '<a class="btn" href="' + REPO_URL + '/tree/main/outputs" target="_blank" rel="noopener">저장소 열기 ↗</a></div></div>';
    } else if (!files.length){
      html = '<div class="none">아직 <b>outputs/</b>에 결과물 파일이 없습니다. 첫 일감이 끝나면 여기에 쌓입니다.<br>' +
        '경로 규칙: <b>outputs/&lt;프로젝트&gt;/&lt;YYYY-MM-DD&gt;-&lt;주제&gt;.md</b>' +
        '<div class="btn-row2"><button class="btn primary" data-act="refresh">🔄 새로고침</button></div></div>';
    } else {
      html = '<p class="pmsg"><b>' + files.length + '개</b> 파일 · ' + esc(REPO) + '/outputs</p><div class="flist">' +
        files.slice().reverse().map(function(f){
          return '<a class="frow" href="' + REPO_URL + '/blob/main/' + encodeURI(f.path) + '" target="_blank" rel="noopener">' +
            '<span class="fi">📄</span><span class="fn">' + esc(f.path.replace(/^outputs\//,'')) + '</span>' +
            '<span class="fa">열기 ↗</span></a>';
        }).join('') + '</div>' +
        '<div class="btn-row2"><button class="btn primary" data-act="refresh">🔄 새로고침</button>' +
        '<a class="btn" href="' + REPO_URL + '" target="_blank" rel="noopener">저장소 ↗</a></div>';
    }
    openSheet('🗂 결과물 (outputs)', html);
  }

  /* ── 지시 미리보기 / 전달 시트 ── */
  function openDraft(text, target, project, reason){
    var msg = composePayload(text, target, project);
    var prompt = '[피클팀 일감 요청]\n' +
      '담당: ' + (target === 'all' ? '전체' : TARGET_LABEL[target]) + '\n' +
      '프로젝트: ' + PROJECT_LABEL[project] + '\n' +
      '지시: ' + text + '\n' +
      '(대장 웹앱에서 GitHub 토큰이 없어 손디에게 전달)';

    var html =
      '<p class="pmsg">' + esc(reason || 'GitHub 토큰이 없어 아직 이슈로 올릴 수 없습니다.') + ' 아래 두 가지 중 하나로 진행하세요.</p>' +
      '<div class="note" style="margin-top:0"><b>올라갈 이슈</b><br>' +
        '제목: <b>' + esc(msg.title) + '</b><br>' +
        '라벨: ' + msg.labels.map(function(l){ return '<span class="chip chip-label" style="margin:2px 2px 0 0">' + esc(l) + '</span>'; }).join('') +
      '</div>' +
      '<div class="btn-row2">' +
        '<button class="btn primary" data-act="token">🔑 GitHub 토큰 설정</button>' +
        '<button class="btn" data-act="copy" data-prompt="' + esc(prompt) + '">📋 복사해서 손디에게 전달</button>' +
      '</div>' +
      '<div class="note">복사한 내용을 이 방에 그대로 붙여넣으면 대장(손디)이 이슈로 올려 드립니다.</div>';

    openSheet('일감으로 올리기', html);
  }

  function copyText(txt){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(txt).then(function(){ return true; }, function(){ return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  /* =========================================================
     이슈 만들기
     ========================================================= */
  function composePayload(text, target, project){
    var firstLine = (text.split('\n')[0] || '').trim();
    var shortTitle = firstLine.length > 56 ? firstLine.slice(0, 56) + '…' : firstLine;
    var prefix;
    if (target === 'all') prefix = '[공용] ';
    else prefix = TARGET_LABEL[target] + ' ';

    var labels = ['status:todo'];
    if (target !== 'all') labels.unshift('owner:' + target);
    if (project !== 'general') labels.push('project:' + project);

    var who = target === 'all'
      ? '전체 (대장이 분배)'
      : TARGET_LABEL[target] + ' · ' + (PEOPLE[target] ? PEOPLE[target].handle : '');
    var now = new Intl.DateTimeFormat('ko-KR', {timeZone:KST, dateStyle:'medium', timeStyle:'short'}).format(new Date());

    var body =
      '## 무엇을\n\n' + text + '\n\n' +
      '## 요청 정보\n\n' +
      '| 항목 | 값 |\n|---|---|\n' +
      '| 담당 | ' + who + ' |\n' +
      '| 프로젝트 | ' + PROJECT_LABEL[project] + ' |\n' +
      '| 요청자 | 성훈님 |\n' +
      '| 등록 | 대장 채팅방 웹앱 · ' + now + ' |\n\n' +
      '## 끝났다고 보는 상태\n\n' +
      '- [ ] 결과물 파일: `outputs/' + (project === 'general' ? '<프로젝트>' : project) + '/<YYYY-MM-DD>-<주제>.md`\n' +
      '- [ ] 이슈 댓글에 결과물 경로와 한 줄 요약 보고\n' +
      '- [ ] 총괄 대장 검수 후 `status:done`\n';

    return {title: prefix + shortTitle, body: body, labels: labels};
  }

  function sendInstruction(){
    var text = $('msg').value.trim();
    var target = $('selTarget').value;
    var project = $('selProject').value;

    if (!text){ toast('지시 내용을 입력해 주세요'); $('msg').focus(); return; }
    if (target === 'na63'){
      // 연결 대기 피클 — 막지는 않고 안내만
      if (!state.token){
        openDraft(text, target, project, '나(@na63) 피클은 아직 GitHub이 연결되지 않았습니다. 이슈는 올릴 수 있지만 담당 피클이 받기 전까지 대기 상태로 남습니다.');
        return;
      }
    }
    if (!state.token){
      toast('GitHub 토큰을 연결하면 바로 이슈로 올릴 수 있어요');
      openDraft(text, target, project);
      return;
    }

    var payload = composePayload(text, target, project);
    var btn = $('btnSend');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">↻</span>';

    gh('/repos/' + REPO + '/issues', {method:'POST', body: payload})
      .then(function(issue){
        state.renderedIssues[issue.number] = 1;
        addSent(text, target, project, issue);
        $('msg').value = '';
        autoGrow();
        toast('✅ ' + (target === 'all' ? '[공용]' : TARGET_LABEL[target]) + ' 이슈 #' + issue.number + ' 생성 완료', 'ok');
        loadLive(true);
      })
      .catch(function(e){
        var m = '이슈 생성 실패';
        if (e.status === 401) m = '토큰이 유효하지 않습니다. 🔑에서 다시 설정해 주세요.';
        else if (e.status === 403) m = '권한 또는 호출 한도 문제입니다(403). 토큰 권한에 Issues 쓰기가 있는지 확인해 주세요.';
        else if (e.status === 404) m = '저장소에 접근할 수 없습니다(404). 토큰의 저장소 접근을 확인해 주세요.';
        else if (e.status === 422) m = '라벨/입력값이 거부되었습니다(422). 잠시 후 다시 시도해 주세요.';
        else if (e.message) m = '이슈 생성 실패 · ' + e.message;
        toast(m, 'err');
        if (e.status === 401) openToken();
      })
      .then(function(){
        btn.disabled = false;
        btn.textContent = '↑';
      });
  }

  function addSent(text, target, project, issue){
    var t = nowISO();
    var me = {
      kind:'me', t:t, text:text,
      chips:[
        {type:'label', v: target === 'all' ? '전체' : TARGET_LABEL[target]},
        {type:'label', v: PROJECT_LABEL[project]},
        {type:'issue', n:issue.number, title:'방금 생성'}
      ]
    };
    var ack = {
      kind:'msg', who:'sonseonghun1', t:t,
      text:'지시 접수 — ' + (target === 'all' ? '[공용]' : TARGET_LABEL[target]) + ' 이슈로 올렸습니다. 담당 피클이 확인하면 status:doing으로 바꾸고 결과물을 outputs/에 남깁니다.',
      chips:[
        {type:'issue', n:issue.number, title:issue.title || ''},
        {type:'status', v:'todo'}
      ]
    };
    state.localItems.push(me, ack);
    state.items.push(me, ack);
    render();
    scrollBottom(true);
  }

  /* =========================================================
     타임라인 스크롤 / 비우기
     ========================================================= */
  function nearBottom(){
    var tl = $('timeline');
    return tl.scrollHeight - tl.scrollTop - tl.clientHeight < 90;
  }
  function scrollBottom(force){
    var tl = $('timeline');
    tl.scrollTop = tl.scrollHeight;
    if (force) tl.scrollTop = tl.scrollHeight;
  }

  /* =========================================================
     이벤트
     ========================================================= */
  $('teamBar').addEventListener('click', function(e){
    var b = e.target.closest('[data-who]');
    if (!b) return;
    openMember(b.getAttribute('data-who'));
  });

  $('btnToken').addEventListener('click', openToken);
  $('btnOutputs').addEventListener('click', openOutputs);
  $('btnRefresh').addEventListener('click', function(){
    if (!state.token){ openToken(); return; }
    loadLive(false);
  });
  $('liveAct').addEventListener('click', function(){
    if (!state.token){ openToken(); return; }
    loadLive(false);
  });

  $('filterClear').addEventListener('click', function(){
    state.filter = null;
    renderMembers();
    render();
  });

  $('btnSend').addEventListener('click', sendInstruction);

  $('selTarget').addEventListener('change', savePrefs);
  $('selProject').addEventListener('change', savePrefs);
  function savePrefs(){
    state.prefs.target = $('selTarget').value;
    state.prefs.project = $('selProject').value;
    writeLS(PREF_KEY, JSON.stringify(state.prefs));
  }

  // textarea 자동 높이
  function autoGrow(){
    var el = $('msg');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 96) + 'px';
  }
  $('msg').addEventListener('input', autoGrow);
  $('msg').addEventListener('keydown', function(e){
    var desktop = window.matchMedia('(min-width:900px)').matches;
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); sendInstruction(); return; }
    if (e.key === 'Enter' && !e.shiftKey && desktop){ e.preventDefault(); sendInstruction(); }
  });

  // 시트 안 버튼 위임
  $('sheetBody').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'token'){ closeSheet(); setTimeout(openToken, 120); return; }
    if (act === 'outputs'){ closeSheet(); setTimeout(openOutputs, 120); return; }
    if (act === 'refresh'){ closeSheet(); loadLive(false); return; }
    if (act === 'filter'){
      state.filter = b.getAttribute('data-who');
      closeSheet();
      renderMembers();
      var chip = document.querySelector('.pm[data-who="' + state.filter + '"]');
      if (chip && chip.scrollIntoView) chip.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
      render();
      toast(PEOPLE[state.filter].name + ' 피클 관련만 봅니다');
      return;
    }
    if (act === 'assign'){
      closeSheet();
      $('selTarget').value = b.getAttribute('data-who');
      savePrefs();
      $('msg').focus();
      toast(PEOPLE[$('selTarget').value].name + ' 앞으로 일감을 적어 보내세요');
      return;
    }
    if (act === 'copy'){
      var txt = b.getAttribute('data-prompt');
      copyText(txt).then(function(ok){
        toast(ok ? '📋 복사했습니다. 이 방에 붙여넣어 주세요.' : '복사가 막혔습니다. 아래 내용을 길게 눌러 복사해 주세요.', ok ? 'ok' : 'err');
        if (!ok) showRawPrompt(txt);
      });
      return;
    }
    if (act === 'saveToken'){
      var v = ($('tokInput').value || '').trim();
      if (!v){ toast('토큰 값을 붙여넣어 주세요', 'err'); return; }
      if (!/^(gh[pousr]_|github_pat_)/.test(v)){ toast('토큰 형식이 아닙니다 (github_pat_… 또는 ghp_…)', 'err'); return; }
      state.token = v;
      if (!writeLS(TOKEN_KEY, v)){ toast('이 브라우저에 저장할 수 없습니다(시크릿 모드일 수 있어요)', 'err'); }
      closeSheet();
      toast('토큰 저장 · GitHub에서 불러옵니다…');
      buildItems(); render(); renderMembers(); renderLiveBar();
      loadLive(false);
      return;
    }
    if (act === 'delToken'){
      state.token = '';
      delLS(TOKEN_KEY);
      state.live = null;
      closeSheet();
      buildItems(); render(); renderMembers(); renderLiveBar();
      toast('토큰을 삭제했습니다');
      return;
    }
  });

  function showRawPrompt(txt){
    var d = document.createElement('div');
    d.className = 'note';
    d.style.marginTop = '10px';
    var ta = document.createElement('textarea');
    ta.readOnly = true;
    ta.value = txt;
    ta.style.cssText = 'width:100%;min-height:110px;border:1px solid #e5eaf3;border-radius:9px;padding:9px;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:vertical';
    d.appendChild(ta);
    $('sheetBody').appendChild(d);
    ta.focus(); ta.select();
  }

  // Esc
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !$('sheet').hidden) closeSheet();
  });

  // 타임라인 안의 안내 카드 버튼 위임
  $('timeline').addEventListener('click', function(e){
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'token') openToken();
    if (act === 'outputs') openOutputs();
    if (act === 'refresh') loadLive(false);
  });

  /* =========================================================
     시작
     ========================================================= */
  function boot(){
    // 저장된 선택 복원
    if (state.prefs.target && TARGET_LABEL[state.prefs.target]) $('selTarget').value = state.prefs.target;
    if (state.prefs.project && PROJECT_LABEL[state.prefs.project]) $('selProject').value = state.prefs.project;

    buildItems();
    render();
    renderMembers();
    renderLiveBar();
    autoGrow();

    // 채팅방처럼 최신 위치에서 열기
    requestAnimationFrame(function(){
      scrollBottom(true);
      setTimeout(function(){ scrollBottom(true); }, 120);
    });

    if (state.token) loadLive(true);
  }

  boot();
})();
</script>
</body>
</html>
